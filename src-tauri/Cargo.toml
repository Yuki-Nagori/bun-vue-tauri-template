[package]
name = "bun-vue-tauri-template"
description = "bun + Vue + TypeScript + Tauri 桌面应用模板"
version.workspace = true
edition.workspace = true

[lib]
name = "bun_vue_tauri_template_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { workspace = true }
serde_json = "1"
tauri.workspace = true
