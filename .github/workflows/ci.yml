# CI：三平台各一条流水线，与本地 verify 同一组检查，步骤拆分便于定位失败
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify（${{ matrix.os }}）
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: dtolnay/rust-toolchain@master
        with:
          # 与 rust-toolchain.toml 保持一致
          toolchain: "1.99.0"
          components: clippy, rustfmt, llvm-tools-preview
      - name: 安装 Tauri Linux 依赖
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      - name: 安装依赖（postinstall 做环境自检）
        run: bun install --frozen-lockfile
      - name: typecheck（vue-tsc）
        run: bun run typecheck
      - name: typecheck（cargo check）
        run: bun run typecheck:rust
      - name: lint（eslint）
        run: bun run lint
      - name: lint（clippy）
        run: bun run lint:rust
      - name: format（prettier）
        run: bun run format:check
      - name: format（rustfmt）
        run: bun run format:rust:check
      - name: test + coverage（vitest）
        run: bun run test:coverage
      - name: test（cargo test）
        run: bun run test:rust
      - name: coverage 门槛（cargo-llvm-cov）
        run: bun run coverage:rust
      - name: 死代码检查（knip）
        run: bun run knip
