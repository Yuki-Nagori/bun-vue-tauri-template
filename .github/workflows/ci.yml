# CI：三平台各一条流水线，覆盖与本地 verify 同一门禁；快门禁前置，Rust 编译类步骤最后跑
name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "ai-docs/**"
      - "**/*.md"
  pull_request:
    paths-ignore:
      - "ai-docs/**"
      - "**/*.md"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: verify（${{ matrix.os }}）
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: dtolnay/rust-toolchain@master
        with:
          # 与 rust-toolchain.toml 保持一致
          toolchain: "1.99.0"
          components: clippy, rustfmt, llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
        with:
          # 失败也保留依赖编译缓存，修复格式或测试后无需重编依赖；工作区源码仍重新检查。
          cache-on-failure: true
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      - name: 安装依赖（postinstall 做环境自检）
        run: bun install --frozen-lockfile
      # 快速门禁前置：不依赖 Rust 编译，失败尽早暴露。
      - name: typecheck（vue-tsc）
        run: bun run typecheck
      - name: lint（eslint）
        run: bun run lint
      - name: format（prettier）
        run: bun run format:check
      - name: format（rustfmt）
        run: bun run format:rust:check
      - name: test + coverage（vitest）
        run: bun run test:coverage
      - name: 死代码检查（knip）
        run: bun run knip
      # Rust 编译类步骤在后：避免格式 / 前端错误消耗 Linux 系统依赖安装与依赖编译时间。
      - name: 安装 Tauri Linux 依赖
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      # clippy 含全量类型检查，不单列 cargo check。
      - name: lint（clippy）
        run: bun run lint:rust
      # llvm-cov 带插桩执行测试并出覆盖率，不单列 cargo test。
      - name: test + coverage 门槛（cargo-llvm-cov）
        run: bun run coverage:rust
