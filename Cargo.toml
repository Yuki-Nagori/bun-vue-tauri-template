[workspace]
resolver = "2"
members = ["src-tauri", "src-rust/template-core"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = [] }
# 成员间依赖统一在此以 path 声明，成员用 template-core.workspace = true 继承。
template-core = { path = "src-rust/template-core" }

# 依赖用行表级调试信息 + O1：tauri 系依赖 O0 下运行卡顿；改动本节会使依赖缓存整体失效。
[profile.dev.package."*"]
opt-level = 1
debug = "line-tables-only"

# profile 只能定义在工作区根（成员里的会被忽略）。
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
